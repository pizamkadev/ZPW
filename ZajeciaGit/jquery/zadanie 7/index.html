    <script>

        // $(document).on("mousemove", function(event){
        //     $("#pageX").text(event.pageX)

        $(function(){
            $("#japko").css("margin-left",  Math.floor((Math.random() * 500) + 1))
            $("#japko").css("margin-top",  Math.floor((Math.random() * 500) + 1))
        })

        $(document).on("keypress", function(key){
            if(key.key === "a"){
                $("#kwadrat").css("margin-left", "-=5px")
            }
            
            if (key.key === 'd'){
                $("#kwadrat").css("margin-left", "+=5px")
            }

            if(key.key === "w"){
                $("#kwadrat").css("margin-top", "-=5px")
            }
            
            if (key.key === 's'){
                $("#kwadrat").css("margin-top", "+=5px")
            }
        })
    </script>
    <title>Document</title>
    <style>
        #kwadrat {
            width: 20px;
            height: 20px;
            background-color: red;
            position: absolute;
        }
        #japko{
            width: 20px;
            height: 20px;
            background-color: green;
            position: absolute;
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
        $(function(){
            $("#formularz").submit(function(e){
                e.preventDefault()
                if($("#password").val().length <= 6){
                    $("#info").text("Hasło jest za krótkie").css("color", "red")
                }else {
                    $("#info").text("Zalogowano").css("color", "green")
                }
            })

            $("#kolor").change(function(){
                $("body").css("background-color", $(this).val())
            })

            $("#ceny").change(function(){
                $("#info-cena").text("Do zapłaty: " + $(this).val() + "zł")
            })
        })
    </script>
    <title>Document</title>
</head>
<body>
    <form id="formularz">
        <input type="email" id="email">
        <input type="password" id="password">
        <button type="submit">Wyślij</button>
    </form>
    <p id="info"></p>
    <hr>
    <select id="kolor">
        <option value="white">Biały</option>
        <option value="yellow">Żółty</option>
        <option value="lightblue">Niebieski</option>
    </select>
    <hr>
    <select id="ceny">
        <option value="20">Mała (20zł)</option>
        <option value="30">Średnia (30zł)</option>
        <option value="40">Duża (40zł)</option>
    </select>
    <p id="info-cena"></p>
</body>
</html>
